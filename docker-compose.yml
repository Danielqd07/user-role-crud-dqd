services:
  mariadb:
    image: mariadb:latest
    container_name: user-role-crud-db

    environment:
      MARIADB_ROOT_PASSWORD: root_password
      MARIADB_DATABASE: user-role-crud
      MARIADB_USER: myuser
      MARIADB_PASSWORD: mypassword

    ports:
      - "3307:3306"

    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data: