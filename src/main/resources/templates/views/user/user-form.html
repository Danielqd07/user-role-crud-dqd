<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/head :: head('User Role CRUD - Usuario')"></head>

<body class="d-flex flex-column h-100">

<header th:replace="fragments/header :: header"></header>

<main class="form-page">

    <div class="form-card">

        <h1 th:text="${user.id == null}
                ? 'Agregar nuevo usuario'
                : 'Editar usuario'">
        </h1>

        <div th:if="${errorMessage}"
             class="alert alert-danger"
             th:text="${errorMessage}">
        </div>

        <form th:action="${user.id == null}
                ? @{/users/insert}
                : @{/users/update}"
              th:object="${user}"
              method="post">

            <input type="hidden"
                   th:field="*{id}">

            <div class="mb-3">

                <label for="username"
                       class="form-label">
                    Usuario
                </label>

                <input type="text"
                       id="username"
                       th:field="*{username}"
                       class="form-control">

                <div th:if="${#fields.hasErrors('username')}"
                     th:errors="*{username}"
                     class="text-danger">
                </div>

            </div>

            <div class="mb-3">

                <label for="email"
                       class="form-label">
                    Email
                </label>

                <input type="email"
                       id="email"
                       th:field="*{email}"
                       class="form-control">

                <div th:if="${#fields.hasErrors('email')}"
                     th:errors="*{email}"
                     class="text-danger">
                </div>

            </div>

            <div class="mb-3">

                <label for="password"
                       class="form-label">
                    Contraseña
                </label>

                <input type="password"
                       id="password"
                       th:field="*{password}"
                       class="form-control">

                <div th:if="${#fields.hasErrors('password')}"
                     th:errors="*{password}"
                     class="text-danger">
                </div>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Roles
                </label>

                <div th:each="role : ${listRoles}"
                     class="form-check">

                    <input type="checkbox"
                           class="form-check-input"
                           name="roleIds"
                           th:value="${role.id}"
                           th:id="${'role-' + role.id}"
                           th:checked="${#lists.contains(user.roles, role)}">

                    <label class="form-check-label"
                           th:for="${'role-' + role.id}"
                           th:text="${role.name}">
                    </label>

                </div>

                <div th:if="${#fields.hasErrors('roles')}"
                     th:errors="*{roles}"
                     class="text-danger">
                </div>

            </div>

            <button type="submit"
                    class="btn btn-primary"
                    th:text="${user.id == null}
                            ? 'Crear'
                            : 'Actualizar'">
            </button>

            <a th:href="@{/users}"
               class="btn btn-secondary">
                Volver
            </a>

        </form>

    </div>

</main>

<footer th:replace="fragments/footer :: footer"></footer>

<div th:replace="fragments/scripts :: scripts"></div>

</body>
</html>
